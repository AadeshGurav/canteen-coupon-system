x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    # No `ports:` here on purpose — mongo is reachable only from the
    # `internal` network, never from the host or from nginx.

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Composed here rather than stored directly, so the credentials only
      # need to be set once (as MONGO_ROOT_USER/PASSWORD) and stay in sync
      # with what mongo itself was initialized with.
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
    volumes:
      - bills_data:/app/generated_bills
      - qr_data:/app/generated_qr
      - app_logs:/app/logs
    networks:
      - internal
      - edge
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    # No `ports:` here either — only reachable via nginx on the `edge` network.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Empty (and 443 unused) until `make tls-setup` generates a cert —
      # see nginx/conf.d/canteen-tls.conf.example.
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Explicit 127.0.0.1, not "localhost": this image's /etc/hosts lists
      # ::1 first, nginx only binds IPv4 (listen 80;), and BusyBox wget —
      # unlike a normal client — doesn't fall back to the next address on a
      # refused connection, so "localhost" here reports unhealthy even
      # though the service is actually fine.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

networks:
  # mongo <-> app only. `internal: true` means Docker gives this network no
  # route out at all — not even the app's own internet access goes through
  # it, and nginx never joins it, so the database is unreachable from
  # anywhere but the app container, regardless of host firewall rules.
  internal:
    driver: bridge
    internal: true
  # nginx <-> app only. Only nginx publishes a port to the host; the app
  # itself is never directly reachable.
  edge:
    driver: bridge

volumes:
  mongo_data:
  bills_data:
  qr_data:
  app_logs:
