name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch/PR cancels any run already in progress for
# it — no point burning CI minutes on a commit that's already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # matches the Dockerfile's base image

permissions:
  contents: read

jobs:
  lint:
    name: Lint (black, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # ruff already covers pyflakes/pycodestyle (most of what flake8 checks)
      # at compile speed, so this is black (formatting) + ruff (linting) —
      # not black+ruff+flake8, which would just be two tools disagreeing
      # over the same rules. See CLAUDE.md §14: "the project's configured
      # equivalents" is explicitly allowed in place of the full trio.
      - name: black --check
        run: black --check --line-length 110 app tests scripts gunicorn_conf.py

      - name: ruff check
        run: ruff check app tests scripts gunicorn_conf.py

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No MongoDB service needed — tests/fakes.py stands in for it, see
      # the "Running tests" section of the README.
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --junitxml=pytest-results.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest-results.xml
            coverage.xml
          retention-days: 14

  docker:
    name: Docker build, vulnerability scan, compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build app image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: canteen-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: nothing built here gets published until it clears this. Same
      # scan a human would run before deploying by hand — codified so it
      # can't be skipped under time pressure.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: canteen-app:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Bring up the full stack (nginx + app + mongo)
        run: |
          cp .env.example .env
          # Random per-run credentials — this stack never persists past the job.
          sed -i "s/MONGO_ROOT_PASSWORD=.*/MONGO_ROOT_PASSWORD=$(openssl rand -hex 20)/" .env
          sed -i "s/HTTP_PORT=.*/HTTP_PORT=8080/" .env
          docker compose up -d --build --wait --wait-timeout 120

      - name: Run smoke test through nginx
        run: python3 scripts/smoke_test.py http://localhost:8080

      - name: Confirm mongo and app are not reachable from the host
        # A bare `! command` doesn't trip `set -e` here (its failure is
        # exempt from errexit when negated) — an explicit if/exit is the
        # only way this check actually fails the step when it should.
        run: |
          if curl -sf --max-time 2 http://localhost:8000/health; then
            echo "FAIL: app port 8000 is reachable directly from the host." >&2
            exit 1
          fi
          if nc -z -w2 localhost 27017; then
            echo "FAIL: mongo port 27017 is reachable directly from the host." >&2
            exit 1
          fi
          echo "Confirmed: app and mongo are only reachable through nginx."

      - name: Show container logs (only runs if a previous step failed)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
