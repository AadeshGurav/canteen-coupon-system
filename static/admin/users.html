<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<nav id="admin-nav"></nav>
<main>
  <h1>Users</h1>
  <p class="empty-state">Three roles: <strong>admin</strong> (everything), <strong>counter</strong>
    (scan + top-ups/billing), <strong>scanner</strong> (scan only). Each person gets their own login —
    the scanner and counter roles are meant for the shared devices at those stations.</p>

  <section class="card">
    <h2>Add a user</h2>
    <form id="user-form">
      <div class="grid grid-2">
        <div class="field">
          <label for="new-username">Username</label>
          <input id="new-username" type="text" required autocomplete="off" placeholder="e.g. counter1">
        </div>
        <div class="field">
          <label for="new-password">Password</label>
          <input id="new-password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="field">
          <label for="new-role">Role</label>
          <select id="new-role">
            <option value="scanner">Scanner (scan only)</option>
            <option value="counter">Counter (scan + top-ups)</option>
            <option value="admin">Admin (everything)</option>
          </select>
        </div>
      </div>
      <button type="submit">Add user</button>
    </form>
  </section>

  <section class="card">
    <h2>All users</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="users-body">
          <tr><td colspan="5" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="reset-password-dialog">
  <form class="card" id="reset-password-form" method="dialog">
    <h2>Reset password</h2>
    <p id="reset-password-username" class="empty-state"></p>
    <input type="hidden" id="reset-password-user-id">
    <div class="field">
      <label for="reset-password-value">New password</label>
      <input id="reset-password-value" type="password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="actions">
      <button type="submit">Set new password</button>
      <button type="button" class="secondary" id="btn-cancel-reset">Cancel</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/users.js"></script>
</body>
</html>
