<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #0f1a15 0%, var(--bg) 55%);
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    margin: 0;
  }
  .login-brand {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: var(--space-3);
    letter-spacing: -0.02em;
  }
  #login-error {
    display: none;
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: #fecaca;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14px;
    margin-bottom: var(--space-2);
  }
</style>
</head>
<body>
<main style="padding: var(--space-2)">
  <form class="card login-card" id="login-form">
    <div class="login-brand" id="login-brand">Canteen Admin</div>
    <p id="login-error" role="alert"></p>
    <div class="field">
      <label for="login-username">Username</label>
      <input id="login-username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" style="width:100%" id="login-submit">Log in</button>
  </form>
</main>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
