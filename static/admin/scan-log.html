<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Log — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<nav id="admin-nav"></nav>
<main>
  <h1>Scan Log</h1>
  <p class="empty-state" id="reversal-window-note"></p>

  <section class="card">
    <div class="field" style="max-width: 260px">
      <label for="reversed-by">Your name (for reversal records)</label>
      <input id="reversed-by" type="text" placeholder="Your name">
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="scans-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Member</th>
            <th>Meal</th>
            <th>Result</th>
            <th>Grace</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="scans-body">
          <tr><td colspan="6" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/scan-log.js"></script>
</body>
</html>
