<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top-ups & Billing — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<nav id="admin-nav"></nav>
<main>
  <h1>Top-ups &amp; Billing</h1>

  <section class="card">
    <h2>New top-up</h2>
    <form id="topup-form">
      <div class="field">
        <label for="topup-member">Member</label>
        <select id="topup-member" required></select>
      </div>

      <div class="grid grid-2">
        <div class="field">
          <label for="topup-lunch">Lunch units</label>
          <input id="topup-lunch" type="number" value="0" min="0">
        </div>
        <div class="field">
          <label for="topup-breakfast">Breakfast units</label>
          <input id="topup-breakfast" type="number" value="0" min="0">
        </div>
        <div class="field">
          <label for="topup-brunch">Brunch units</label>
          <input id="topup-brunch" type="number" value="0" min="0">
        </div>
      </div>

      <div class="card" style="background:var(--bg-elevated);margin-bottom:var(--space-2);padding:var(--space-2)">
        <label style="margin-bottom:2px">Amount (calculated from unit prices in Settings)</label>
        <div style="font-size:28px;font-weight:700;color:var(--accent)" id="topup-amount-preview">₹0.00</div>
      </div>

      <div class="grid grid-2">
        <div class="field">
          <label for="topup-method">Payment method</label>
          <select id="topup-method">
            <option value="cash">Cash</option>
            <option value="upi">UPI</option>
          </select>
        </div>
        <div class="field">
          <label for="topup-created-by">Recorded by</label>
          <input id="topup-created-by" type="text" required placeholder="Your name">
        </div>
      </div>

      <button type="submit" id="topup-submit">Record top-up &amp; generate bill</button>
    </form>
  </section>

  <section class="card">
    <h2>Recent top-ups</h2>
    <div class="table-wrap">
      <table id="topups-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Member</th>
            <th>Units (L/B/Br)</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="topups-body">
          <tr><td colspan="7" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="upi-qr-dialog">
  <div class="card" style="text-align:center">
    <h2>Scan to pay via UPI</h2>
    <p class="empty-state" id="upi-qr-amount"></p>
    <img id="upi-qr-image" alt="UPI payment QR code" style="width:220px;height:220px;border-radius:var(--radius-sm);background:#fff;padding:8px">
    <div class="actions" style="justify-content:center;margin-top:var(--space-2)">
      <button type="button" class="secondary" id="btn-close-qr">Close</button>
    </div>
  </div>
</dialog>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/topups.js"></script>
</body>
</html>
