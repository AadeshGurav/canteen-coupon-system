<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<nav id="admin-nav"></nav>
<main>
  <h1>Dashboard</h1>

  <section class="grid grid-2" id="stat-cards">
    <div class="card"><strong>Active members</strong><div style="font-size:28px" id="stat-members">—</div></div>
    <div class="card"><strong>Pending UPI payments</strong><div style="font-size:28px" id="stat-pending">—</div></div>
    <div class="card" id="stat-revenue-card"><strong>This month's revenue</strong><div style="font-size:28px" id="stat-revenue">—</div></div>
    <div class="card" id="stat-profit-card"><strong>This month's profit</strong><div style="font-size:28px" id="stat-profit">—</div></div>
  </section>

  <section class="card">
    <h2>Quick links</h2>
    <div class="actions" id="quick-links"></div>
  </section>

  <section class="card" id="recent-activity-card">
    <h2>Recent activity</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Member</th><th>Meal</th><th>Result</th></tr></thead>
        <tbody id="recent-scans-body">
          <tr><td colspan="4" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/index.js"></script>
</body>
</html>
