<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members — Canteen Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<nav id="admin-nav"></nav>
<main>
  <h1>Members</h1>

  <section class="card">
    <div class="form-row">
      <div class="field">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="">All</option>
          <option value="student">Student</option>
          <option value="staff">Staff</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-search">Search by name</label>
        <input id="filter-search" type="text" placeholder="Start typing a name...">
      </div>
      <div class="field">
        <button id="btn-new-member" type="button">+ Add member</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="table-wrap">
      <table id="members-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Details</th>
            <th>Lunch</th>
            <th>Breakfast</th>
            <th>Brunch</th>
            <th>Grace left</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="members-body">
          <tr><td colspan="9" class="empty-state">Loading members…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<dialog id="member-dialog">
  <form class="card" id="member-form" method="dialog">
    <h2 id="member-dialog-title">Add member</h2>
    <input type="hidden" id="member-id">

    <div class="field">
      <label for="member-type">Type</label>
      <select id="member-type" required>
        <option value="student">Student</option>
        <option value="staff">Staff</option>
      </select>
    </div>

    <div class="field">
      <label for="member-name">Name</label>
      <input id="member-name" type="text" required>
    </div>

    <div class="grid grid-2">
      <div class="field" id="field-class-name">
        <label for="member-class">Class</label>
        <input id="member-class" type="text">
      </div>
      <div class="field" id="field-roll-number">
        <label for="member-roll">Roll number</label>
        <input id="member-roll" type="text">
      </div>
      <div class="field" id="field-staff-id" style="display:none">
        <label for="member-staff-id">Staff ID</label>
        <input id="member-staff-id" type="text">
      </div>
      <div class="field">
        <label for="member-grace">Grace allowance override (units, optional)</label>
        <input id="member-grace" type="number" min="0" placeholder="Uses global default">
      </div>
    </div>

    <div class="field" id="field-status" style="display:none">
      <label for="member-status">Status</label>
      <select id="member-status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" class="secondary" id="btn-cancel-member">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="credit-dialog">
  <form class="card" id="credit-form" method="dialog">
    <h2>Credit balance</h2>
    <p id="credit-member-name" class="empty-state"></p>
    <input type="hidden" id="credit-member-id">
    <div class="grid grid-2">
      <div class="field">
        <label for="credit-lunch">Lunch units</label>
        <input id="credit-lunch" type="number" value="0" min="0">
      </div>
      <div class="field">
        <label for="credit-breakfast">Breakfast units</label>
        <input id="credit-breakfast" type="number" value="0" min="0">
      </div>
      <div class="field">
        <label for="credit-brunch">Brunch units</label>
        <input id="credit-brunch" type="number" value="0" min="0">
      </div>
    </div>
    <p class="empty-state">For a billed top-up with a PDF bill and UPI QR, use
      <a href="topups.html">Top-ups &amp; Billing</a> instead — this is a direct
      balance adjustment with no bill (corrections, migrations).</p>
    <div class="actions">
      <button type="submit">Apply credit</button>
      <button type="button" class="secondary" id="btn-cancel-credit">Cancel</button>
    </div>
  </form>
</dialog>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/members.js"></script>
</body>
</html>
