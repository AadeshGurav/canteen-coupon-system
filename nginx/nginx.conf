user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Container logs — captured by `docker compose logs nginx` and the
    # json-file driver's own rotation (see docker-compose.yml), same as
    # every other service in this stack.
    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Bill PDFs and QR images are small; this is generous headroom, not a
    # sizing assumption — adjust via nginx/conf.d if bulk imports ever need more.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript text/xml application/xml image/svg+xml;

    # Two independent limits: a generous general one for the admin dashboard,
    # and a tighter one for /scan — which is machine-driven (one QR read per
    # scan) so a burst here is more likely a stuck retry loop than a real user.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=scan:10m rate=5r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
