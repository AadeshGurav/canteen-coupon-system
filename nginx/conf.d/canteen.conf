upstream canteen_app {
    # "app" resolves via Docker's embedded DNS on the internal compose network.
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Baseline hardening headers — cheap, and there's no reason not to have
    # them even on a LAN-only deployment.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx's own liveness check — doesn't touch the app, so it stays cheap
    # and doesn't count against the app's rate limits.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # The counter scanner hits this every single scan, all meal period —
    # tighter limit, small burst for a shaky phone connection retrying.
    location = /scan {
        limit_req zone=scan burst=10 nodelay;
        proxy_pass http://canteen_app;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://canteen_app;
        include /etc/nginx/proxy_params.conf;
    }
}

# --- To add TLS later (a real cert, or a self-signed one for the LAN) ---
# 1. Mount your cert/key into this container, e.g. ./nginx/certs:/etc/nginx/certs:ro
# 2. Add a second server block:
#      server {
#          listen 443 ssl;
#          server_name _;
#          ssl_certificate     /etc/nginx/certs/fullchain.pem;
#          ssl_certificate_key /etc/nginx/certs/privkey.pem;
#          ssl_protocols TLSv1.2 TLSv1.3;
#          ... same locations as the :80 server above ...
#      }
# 3. Optionally redirect the :80 server to :443 instead of serving directly.
