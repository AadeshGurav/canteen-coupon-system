upstream canteen_app {
    # "app" resolves via Docker's embedded DNS on the internal compose network.
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Baseline hardening headers — cheap, and there's no reason not to have
    # them even on a LAN-only deployment.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/locations.inc;
}

# --- TLS (port 443) is a separate, optional file: canteen-tls.conf.example ---
# It's a *requirement*, not a nice-to-have, for the scanner page specifically:
# browsers only allow camera access (getUserMedia) in a "secure context" —
# HTTPS, or literally localhost — and that rule applies even on a fully
# private LAN. Without it, the scanner's camera prompt never appears at all
# (see docs/PRD.md §7 and the troubleshooting entry in docs/USER_GUIDE.md).
# The admin dashboard doesn't strictly need it to function, but everything
# sent over plain :80 — including login credentials — is unencrypted on the
# wire, so treat TLS as the default, not an afterthought.
#
# Run `make tls-setup` (see scripts/setup_tls.sh) to generate a locally
# trusted certificate and activate canteen-tls.conf automatically. See that
# script and docs/USER_GUIDE.md §2.3 for the one-time per-device trust step
# this requires on each phone.
