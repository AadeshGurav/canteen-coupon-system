[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# Without this, `app` is only importable when invoked as `python -m pytest`
# (which prepends cwd to sys.path) — a bare `pytest` doesn't, and fails with
# "ModuleNotFoundError: No module named 'app'". This makes both invocations
# work the same way regardless of how/where pytest is run from.
pythonpath = .
